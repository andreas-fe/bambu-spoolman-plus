services:
  bambu-bridge:
    image: bambu-spoolman-bridge:local
    build: ./bridge
    container_name: bambu-spoolman-bridge
    restart: unless-stopped
    init: true
    ports:
      - "${BRIDGE_PORT:-7913}:7913"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bridge.sqlite3
      MAPPING_FILE: /app/data/mapping.json
      WEB_PORT: "7913"
      TZ: Europe/Berlin
    volumes:
      - ${BRIDGE_DATA_DIR:-./data}:/app/data
    networks:
      - default
      - spoolman
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  spoolman:
    external: true
    name: ${SPOOLMAN_NETWORK:?Set SPOOLMAN_NETWORK to the existing Spoolman Docker network}
